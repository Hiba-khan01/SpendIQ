<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Receipt Paper Gradients -->
    <linearGradient id="recBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>

    <linearGradient id="recCurl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0077E6" />
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0096C7" />
    </linearGradient>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Arrow Swoosh -->
    <linearGradient id="arrGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00E5FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="240" height="240" rx="52" fill="url(#bgGrad)" />

  <g transform="translate(10, 5)" filter="url(#glow)">
    <!-- Receipt Sheet -->
    <path
      d="M 64 60 L 156 60 L 156 168 L 148 160 L 140 168 L 132 160 L 124 168 L 116 160 L 108 168 L 100 160 L 92 168 L 84 160 L 76 168 L 68 160 L 64 164 Z"
      fill="url(#recBody)"
      stroke="#BFDBFE"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Receipt Folded / Curled Top -->
    <path
      d="M 56 60 C 56 28, 104 28, 104 60 C 88 60, 72 60, 56 60 Z"
      fill="url(#recCurl)"
    />

    <!-- Receipt Lines -->
    <rect x="76" y="76" width="44" height="7" rx="3.5" fill="#3B82F6" opacity="0.85" />
    <rect x="76" y="90" width="32" height="7" rx="3.5" fill="#60A5FA" opacity="0.85" />
    <rect x="76" y="104" width="24" height="7" rx="3.5" fill="#93C5FD" opacity="0.85" />

    <!-- Rising Bar Charts -->
    <rect x="104" y="120" width="13" height="44" rx="6.5" fill="url(#bg1)" />
    <rect x="122" y="104" width="13" height="60" rx="6.5" fill="url(#bg2)" />
    <rect x="140" y="84" width="13" height="80" rx="6.5" fill="url(#bg3)" />
    <rect x="158" y="64" width="13" height="100" rx="6.5" fill="url(#bg4)" />

    <!-- Arrow Swoosh -->
    <path
      d="M 84 164 C 108 160, 144 148, 182 88"
      fill="none"
      stroke="url(#arrGrad)"
      stroke-width="9"
      stroke-linecap="round"
    />
    <path
      d="M 166 88 L 184 86 L 182 104"
      fill="none"
      stroke="url(#arrGrad)"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
