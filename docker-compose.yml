version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: spendiq-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://spendiq_user:spendiq_pass@db:3306/spendiq
      - JWT_SECRET=spendiq-super-secret-jwt-key-2026-production-ready
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spendiq-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: spendiq-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: spendiq
      MYSQL_USER: spendiq_user
      MYSQL_PASSWORD: spendiq_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
